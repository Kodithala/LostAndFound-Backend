spring.application.name=lostfound
server.port=${PORT:8080}

# Database Configuration (Auto-detects Railway MYSQL_URL, custom DB_URL, or H2 database)
spring.datasource.url=${MYSQL_URL:${DB_URL:jdbc:h2:file:./data/lostfounddb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}}
spring.datasource.username=${MYSQLUSER:${DB_USERNAME:sa}}
spring.datasource.password=${MYSQLPASSWORD:${DB_PASSWORD:}}

# HikariCP Fault Tolerance: Prevents server crash on startup if DB connection is delayed
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# JPA / Hibernate Settings (Dialect and Driver are auto-detected by Spring Boot)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=86400000

# File Upload Settings
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=uploads

# AI Integration Configuration
ai.api.key=${AI_API_KEY:}
ai.threshold=50.0

# CORS Configuration
cors.allowed-origins=${CORS_ORIGIN:http://localhost:5173,http://localhost:3000}
